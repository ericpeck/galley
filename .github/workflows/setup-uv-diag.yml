      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-uv-diag
          path: diag-results/
          if-no-files-found: error

      - name: Fail the job when a sample or a pin check failed
        if: always()
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/helper/.github/diagnostics/setup_uv_diag.py" summarize \
            --input "$GITHUB_WORKSPACE/diag-results/samples.jsonl" \
            --identity "$GITHUB_WORKSPACE/diag-results/identity.json"
