      - name: Run sample 5 (B)
        continue-on-error: true
        env:
          DIAG_UV: ${{ steps.setup_5.outputs.uv-path }}
          DIAG_UV_VERSION: ${{ steps.setup_5.outputs.uv-version }}
          DIAG_PYTHON_VERSION: ${{ steps.setup_5.outputs.python-version }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/helper/.github/diagnostics/setup_uv_diag.py" sample \
            --index 5 \
            --variant B \
            --action-sha 68559e99cc807c1eb7e9238fd43a15bba460eec2 \
            --app-source "$GITHUB_WORKSPACE/app" \
