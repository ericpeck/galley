      - name: Set up uv for sample 4 (B, v10.3.3)
        id: setup_4
        if: steps.gate_4.outputs.launch == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.10"
          enable-cache: false

      - name: Run sample 4 (B)
        continue-on-error: true
        env:
          DIAG_UV: ${{ steps.setup_4.outputs.uv-path }}
          DIAG_UV_VERSION: ${{ steps.setup_4.outputs.uv-version }}
          DIAG_PYTHON_VERSION: ${{ steps.setup_4.outputs.python-version }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/helper/.github/diagnostics/setup_uv_diag.py" sample \
            --index 4 \
            --variant B \
            --action-sha 68559e99cc807c1eb7e9238fd43a15bba460eec2 \
            --app-source "$GITHUB_WORKSPACE/app" \
            --uv "$DIAG_UV" \
            --reported-uv-version "$DIAG_UV_VERSION" \
            --reported-python-version "$DIAG_PYTHON_VERSION" \
            --output "$GITHUB_WORKSPACE/diag-results/samples.jsonl" \
            --state-dir "$GITHUB_WORKSPACE/diag-state" \
            --work-root "${RUNNER_TEMP}/diag" \
            --expected-sha 50950262452a27cfe0faf07746f60f89d508887d \
