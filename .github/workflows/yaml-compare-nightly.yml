name: Nightly YAML comparison

on:
  schedule:
    # 06:17 UTC. The 48-document sample stays in CI; this run is the full set.
    # Failure emails go to whoever last edited the cron line (the repo owner), GitHub disables scheduled workflows after 60 days of repo inactivity, and the token stays read-only (no auto-filed issues).
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - src/galley/core/format.py
      - tests/core/test_yaml_clib.py
      - .github/workflows/yaml-compare-nightly.yml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: YAML parser comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          # The workflow token is contents: read, which cannot write the Actions cache.
          enable-cache: false

      - name: Sync dependencies
        # Installs ruamel.yaml.clib so the C parser is actually compared.
        run: uv sync

      - name: Compare 20000 documents and 50000 emitted values
        env:
          QT_QPA_PLATFORM: offscreen
          GALLEY_YAML_COMPARE_FULL: "1"
        # These tests do not use Qt. pytest-qt imports Qt at startup, and
        # that import needs libEGL, which the Ubuntu runner does not have.
        run: >-
          uv run pytest -p no:pytest-qt
          tests/core/test_yaml_clib.py::test_random_documents_match_pure_python_full
          tests/core/test_yaml_clib.py::test_c_emitter_writes_the_pure_emitter_bytes_full
