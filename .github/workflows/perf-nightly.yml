name: Nightly perf

on:
  schedule:
    # 06:43 UTC, after the nightly YAML comparison.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    name: ${{ matrix.name }}
    # Budgets are checked on main only. A dispatch from another branch skips.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: perf strict (macOS arm64)
            os: macos-15
            platform: macOS arm64
          - name: perf strict (Windows)
            os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        # Git Bash on Windows, so both legs run the same scripts.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          # The Actions cache is not needed for one run a night.
          enable-cache: false

      - name: Sync dependencies
        run: uv sync

      - name: Run perf budgets (strict mode)
        id: perf
        env:
          QT_QPA_PLATFORM: offscreen
          GALLEY_PERF_MODE: strict
          # The log is read back for the issue body; keep it UTF-8 on Windows.
          PYTHONUTF8: "1"
        # Strict mode fails when a median passes the budget itself.
        run: |
          set -o pipefail
          uv run pytest -m perf -rfEP 2>&1 | tee "${RUNNER_TEMP}/perf.log"

      - name: Run nightly-only budgets (strict mode)
        id: nightly
        # Runs even when the perf step failed, so both results reach the issue.
        if: success() || steps.perf.outcome == 'failure'
        env:
          QT_QPA_PLATFORM: offscreen
          GALLEY_PERF_MODE: strict
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          uv run pytest -m nightly_budget -rfEP 2>&1 | tee -a "${RUNNER_TEMP}/perf.log"

      - name: Open or update the missed-budget issue
        if: failure() && (steps.perf.outcome == 'failure' || steps.nightly.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM: ${{ matrix.platform }}
          # One title per platform, so the two legs never race on one issue.
          TITLE: "Nightly perf: a strict budget was missed on main (${{ matrix.platform }})"
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/perf.log"
          body="${RUNNER_TEMP}/issue.md"
          {
            echo "The nightly strict perf run failed on \`main\` at ${GITHUB_SHA} on ${PLATFORM}."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Strict mode fails when a median passes its budget. The pull request perf jobs run gate mode, which allows 3x. Ratio budgets get no multiplier in either mode."
            echo "Rerun one test locally with \`GALLEY_PERF_MODE=strict uv run pytest -m perf -k <test>\`."
            echo
            echo '```'
            if grep -Eq '^=+ (ERRORS|FAILURES) =+$' "${log}"; then
              awk '/^=+ (ERRORS|FAILURES) =+$/ { show = 1 } show' "${log}" | head -c 60000
            else
              tail -n 200 "${log}" | head -c 60000
            fi
            echo
            echo '```'
          } > "${body}"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 \
            --json number,title --jq ".[] | select(.title == env.TITLE) | .number" | head -n 1)"
          if [ -n "${existing}" ]; then
            echo "Issue #${existing} is already open; adding this run to it."
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body-file "${body}"
          fi
