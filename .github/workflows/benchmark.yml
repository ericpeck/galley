name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new dispatch for this ref cancels the in-progress run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-bench:
    name: Size benchmark (macOS arm64)
    runs-on: macos-14
    # Above the benchmark step timeout so a timed-out run can still upload.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          # The workflow token is contents: read, which cannot write the Actions cache.
          enable-cache: false

      - name: Sync dependencies
        run: uv sync

      # The project depends on ruamel.yaml.clib. yaml_safe_c and the shipped
      # C-path rows also pass uv run --with ruamel.yaml.clib==0.2.15.
      # --corpus all keeps the historical rows and adds the realistic corpus.
      # Natural, clean, and forced-reparse rows stop at 5 MB. Each
      # single-trigger row stops at 1 MB. The script default stays plain.
      # The ladders are sized for about 45 minutes on macos-14.
      - name: Run file-size benchmark
        timeout-minutes: 60
        run: uv run python benchmarks/size_bench.py --corpus all

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-bench-macos-14
          path: benchmarks/results/
          if-no-files-found: error
