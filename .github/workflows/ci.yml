name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          # The workflow token is contents: read, which cannot write the Actions cache.
          enable-cache: false

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

  test-macos:
    name: Test (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Sync dependencies
        # Installs ruamel.yaml.clib so the C path and the skip-if-no-clib tests run.
        run: uv sync

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -rfEP keeps failure reports and prints the informational timing table.
        run: |
          uv run pytest -rfEP --junitxml="${RUNNER_TEMP}/pytest.xml"
          uv run python - "${RUNNER_TEMP}/pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse(sys.argv[1])
          skipped = []
          for case in tree.iter("testcase"):
              for node in case.findall("skipped"):
                  message = node.get("message") or (node.text or "")
                  if "ruamel.yaml.clib is not installed" in message:
                      skipped.append(f"{case.get('classname')}::{case.get('name')}")
          if skipped:
              print("clib tests skipped on macOS:")
              print("\n".join(skipped))
              sys.exit(1)
          print("clib-only tests ran")
          PY

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Sync dependencies
        # Pure Python on purpose, so the no-clib fallback stays covered.
        # --no-sync on the next step stops uv run from installing clib again.
        run: uv sync --no-install-package ruamel.yaml.clib

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -rfEP keeps failure reports and prints the informational timing table.
        run: uv run --no-sync pytest -rfEP

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" gitleaks
          chmod 0755 gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: |
          "${RUNNER_TEMP}/gitleaks" detect --source . --verbose --redact
