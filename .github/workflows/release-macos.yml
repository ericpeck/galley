name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Disk image (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          # The workflow token is contents: read, which cannot write the Actions cache.
          enable-cache: false

      - name: Install Galley
        run: uv sync --frozen --no-dev --no-editable

      - name: Build Galley.app
        run: >
          uv run --frozen --no-dev --no-editable
          --with pyinstaller==6.22.3
          pyinstaller --noconfirm --clean
          --distpath dist --workpath build
          packaging/galley.spec

      - name: Check the app bundle
        run: |
          set -euo pipefail
          app="dist/Galley.app"
          bin="${app}/Contents/MacOS/Galley"
          if [[ ! -d "${app}" || ! -x "${bin}" ]]; then
            echo "Galley.app or its executable is missing"
            exit 1
          fi
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          if [[ "${identifier}" != "com.galley.app" ]]; then
            echo "Unexpected bundle identifier: ${identifier}"
            exit 1
          fi

      # Hard-fail when the extension is missing by setting REQUIRE_RUAMEL_CLIB=true
      # once galley depends on ruamel.yaml.clib at runtime. Until that core change
      # merges, a missing extension is expected and this step only leaves a note.
      - name: Check for ruamel.yaml.clib in the bundle
        env:
          REQUIRE_RUAMEL_CLIB: "false"
        run: |
          set -euo pipefail
          clibs="$(find dist/Galley.app -type f \( -name '_ruamel_yaml*.so' -o -name '_ruamel_yaml*.dylib' \))"
          if [[ -z "${clibs}" ]]; then
            echo "NOTE: ruamel.yaml.clib (_ruamel_yaml) is not in Galley.app."
            echo "Skipping the hard check until the core PR adds it as a runtime dependency."
            echo "::notice title=ruamel.yaml.clib not bundled::The C extension is absent. This check does not fail the build until REQUIRE_RUAMEL_CLIB is true."
            if [[ "${REQUIRE_RUAMEL_CLIB}" == "true" ]]; then
              exit 1
            fi
            exit 0
          fi
          echo "Bundled ruamel.yaml.clib extension:"
          echo "${clibs}"

      - name: Smoke-launch Galley headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          bin="dist/Galley.app/Contents/MacOS/Galley"
          "${bin}" &
          pid="$!"
          i=0
          while [[ "${i}" -lt 8 ]]; do
            if ! kill -0 "${pid}" 2>/dev/null; then
              status=0
              wait "${pid}" || status="$?"
              echo "Galley exited early with status ${status}"
              exit 1
            fi
            sleep 1
            i=$((i + 1))
          done
          kill "${pid}" 2>/dev/null || true
          wait "${pid}" || true
          echo "Galley stayed up under QT_QPA_PLATFORM=offscreen"

      - name: Package the disk image
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(uv run --frozen --no-dev --no-editable python -c 'from galley import __version__; print(__version__)')"
          fi
          case "${version}" in
            "" | *[!0-9A-Za-z._-]*)
              echo "Version is not safe for a file name: ${version}"
              exit 1
              ;;
          esac
          dmg="Galley-${version}-arm64.dmg"
          attempt=1
          while [[ "${attempt}" -le 3 ]]; do
            if hdiutil create \
              -volname "Galley" \
              -srcfolder "dist/Galley.app" \
              -ov \
              -format UDZO \
              "dist/${dmg}"; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "hdiutil create failed"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          (
            cd dist
            shasum -a 256 "${dmg}" > "${dmg}.sha256"
          )

      - name: Upload disk image and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galley-macos-arm64
          path: |
            dist/Galley-*-arm64.dmg
            dist/Galley-*-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galley-macos-arm64
          path: dist

      - name: Attach the disk image to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.dmg dist/*.sha256)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No disk image to attach"
            exit 1
          fi
          notes="Unsigned macOS Apple Silicon build. No Developer ID signature and no notarization. On first launch, right-click Galley.app and choose Open, or open System Settings, then Privacy & Security, and choose Open Anyway."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" --title "${tag}" --notes "${notes}"
          fi
