<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Galley app icon master. Accent #0080A6. macOS grid: 824 px squircle centered in 1024. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0080A6"/>
  <!-- mast -->
  <rect x="452" y="220" width="36" height="352" rx="10" fill="#FFFFFF"/>
  <!-- sail: indented lines -->
  <g stroke="#FFFFFF" stroke-width="46" stroke-linecap="round">
    <line x1="534" y1="280" x2="704" y2="280"/>
    <line x1="584" y1="378" x2="744" y2="378"/>
    <line x1="584" y1="476" x2="694" y2="476"/>
  </g>
  <!-- hull with raised bow (right) and stern (left) -->
  <path d="M206 540 Q250 572 300 580 H716 Q780 572 826 520 Q808 640 720 690 H330 Q250 670 206 540 Z" fill="#FFFFFF"/>
  <!-- oars: parallel, slanting back, rowing -->
  <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round">
    <line x1="380" y1="690" x2="320" y2="776"/>
    <line x1="490" y1="690" x2="430" y2="776"/>
    <line x1="600" y1="690" x2="540" y2="776"/>
  </g>
  <!-- water -->
  <path d="M250 800 Q300 772 350 800 T450 800 T550 800 T650 800 T750 800" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="22" stroke-linecap="round"/>
</svg>
