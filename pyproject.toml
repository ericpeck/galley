[project]
name = "galley"
version = "0.1.0"
description = "Desktop app for formatting, validating, and converting JSON and YAML."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6==6.9.3",
    "PySide6-Essentials==6.9.3",
    "PySide6-Addons==6.9.3",
    "ruamel.yaml>=0.18",
    # Bumping ruamel.yaml.clib requires re-running the pure-Python comparison
    # test in tests/core/test_yaml_clib.py first.
    "ruamel.yaml.clib==0.2.15",
]

[project.scripts]
galley = "galley.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.4",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S102", "S307", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PySide6".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PySide6.QtCore".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PySide6.QtGui".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PySide6.QtWidgets".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PySide2".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PyQt6".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"PyQt5".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"shiboken6".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"shiboken2".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."
"qtpy".msg = "Import Qt only from galley.app. galley.core must stay free of Qt."

[tool.ruff.lint.per-file-ignores]
"src/galley/app/**/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
# Wall-clock budgets run only with -m perf. A later -m on the command line
# replaces this one.
addopts = "-m 'not perf'"
# A test still running after 5 minutes prints every thread's stack and ends
# the run, so a hang fails in the log instead of using up the job's time.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
# pytest-timeout: a test still running after 120 s, setup and teardown
# included, prints every thread's stack and ends the run. "thread" works on
# Windows too. The faulthandler limit above is a backstop for a run with the
# plugin off.
timeout = 120
timeout_method = "thread"
# Lets a call-site audit (GALLEY_BIGCOMPARE_AUDIT=1, see tests/conftest.py)
# log passing compares of texts over 64 KB. Without the audit, a passing
# assert costs one extra check. It stays on because pytest caches rewritten
# asserts without regard to this setting.
enable_assertion_pass_hook = true
markers = [
    "perf: wall-clock budget; deselected by default, run with -m perf (tests/perf.py)",
    "nightly_budget: budget asserted only under GALLEY_PERF_MODE=strict (nightly on main); prints the timing otherwise",
    "allow_window_leak: a known MainWindow leak; the leak guard in tests/conftest.py still closes the windows but doesn't fail the test",
]
